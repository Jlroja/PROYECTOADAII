services:
  api:
    build: ./api
    container_name: asignacion-cupos-api
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
    command: uvicorn server:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/docs"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    build: ./frontend
    container_name: asignacion-cupos-web
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
      HOST: 0.0.0.0
      PORT: "5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173
    depends_on:
      api:
        condition: service_healthy
